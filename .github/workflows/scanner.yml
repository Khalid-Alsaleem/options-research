name: daily-call-scanner
on:
  workflow_dispatch:          # manual run; add a schedule later when you approve it
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - name: Scan
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/scanner.py
      - name: Save signals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scanner/signals.md
          git commit -m "Daily signals" || echo "No changes"
          git push
